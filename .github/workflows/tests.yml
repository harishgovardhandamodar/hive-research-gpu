name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install arxiv PyMuPDF requests PyYAML numpy pynvml ruff

      - name: Ruff (errors only)
        run: ruff check hive_research companion --select E9,F63,F7,F82 --quiet

      - name: Run test suite
        run: python -m unittest discover -s hive_research/tests -t . -v

      - name: Install companion backend dependencies
        run: pip install fastapi uvicorn httpx pydantic

      - name: Run companion backend tests
        working-directory: companion/backend
        run: python -m unittest discover -v
