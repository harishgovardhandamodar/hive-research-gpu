services:
  hive-research-gpu:
    build:
      context: .
    network_mode: host
    volumes:
      - hive_data:/app/data
    environment:
      # All inference goes through the fox-services gateway, which speaks the
      # Ollama native API, so no client changes are needed -- but it also
      # routes, queues and accounts for every call, which a bare Ollama does
      # not.
      #
      # Default is axiom-1, the 2x RTX 5080 peer over Tailscale: the models
      # this app wants (qwen3.8:27b, llama3.2:3b, nomic-embed-text) are
      # resident there, and it keeps this host's own GPUs free. Override with
      # OLLAMA_BASE_URL to use a local gateway instead.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://axiom-1.tailb61a66.ts.net:8210}
      # Embeddings stay on the same gateway. They used to be pinned to a bare
      # Ollama (:11434) to dodge a large chat model hogging VRAM; the gateway
      # solves that with per-model slots, and pinning here made every embedding
      # invisible to its telemetry and accounting.
      - OLLAMA_EMBED_BASE_URL=
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.8:27b}
      - OLLAMA_FAST_MODEL=${OLLAMA_FAST_MODEL:-llama3.2:3b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      # Attribution: without these the gateway files this app's calls as
      # "gateway-unknown" and cannot tell a bulk re-ingest from human queries.
      - OLLAMA_SERVICE_NAME=hive-research-gpu
      - OLLAMA_REQUESTOR=subagent
      # Long-form generation (surveys, deep answers) on thinking models
      # needs several minutes; 180s aborted them mid-write.
      - OLLAMA_TIMEOUT=900
      # Set HIVE_TOKEN to require auth on every request; the healthcheck
      # below automatically presents it.
      - HIVE_TOKEN=${HIVE_TOKEN:-}
    shm_size: 8gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null -w '%{http_code}' -H \"X-Hive-Token: $${HIVE_TOKEN:-}\" http://localhost:7777/api/stats | grep -q 200"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  companion:
    build:
      context: .
      dockerfile: Dockerfile.companion
    network_mode: host
    depends_on:
      hive-research-gpu:
        condition: service_healthy
    volumes:
      - companion_data:/app/data/companion
    environment:
      # The companion drives the app through its HTTP API (single writer).
      - HIVE_API_URL=http://localhost:7777
      - HIVE_TOKEN=${HIVE_TOKEN:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://axiom-1.tailb61a66.ts.net:8210}
      - OLLAMA_FAST_MODEL=${OLLAMA_FAST_MODEL:-llama3.2:3b}
      # Ideation runs on the gateway too. It was pinned to a bare Ollama
      # (:11434) to keep generation off the chat instance, but the gateway's
      # per-model slots already do that, and pinning made every ideation call
      # invisible to the gateway's accounting.
      - OLLAMA_IDEATION_URL=
      - OLLAMA_SERVICE_NAME=hive-research-gpu-companion
      - OLLAMA_REQUESTOR=agent
    restart: unless-stopped

  # Agentic Knowledge Mapper — sibling addon (../agentic-knowledge-mapper).
  # Requires that checkout next to this repo. Standalone investigation app:
  # plan→search→analyze→map loop, explainer, AI-security reports, audit ledger.
  # Bridge-mode on purpose: the standalone sibling stack already owns :8204,
  # so this copy serves on :8209. LLM traffic exits via host.docker.internal.
  knowledge-mapper:
    build:
      context: ../agentic-knowledge-mapper
    ports:
      - "8209:8204"
    volumes:
      - akm_data:/app/data
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:8210/v1}
      - LLM_FALLBACK_URL=${LLM_FALLBACK_URL:-http://host.docker.internal:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen3.8:27b}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-qwen3.8:27b}
      - LLM_TIMEOUT_S=${LLM_TIMEOUT_S:-180}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://localhost:8204/api/health | grep -q 200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # 3rd tab of the mapper UI ("AI Standards & Regulations"): static build of
  # the vendored dashboard (../agentic-knowledge-mapper/standards-dashboard).
  # On :5174 (bridge) because the standalone sibling stack already owns :5173.
  # Note: the mapper GUI hardcodes its iframe to <host>:5173, so the Standards
  # tab shows the standalone dashboard; this copy is for direct access.
  mapper-standards:
    build:
      context: ../agentic-knowledge-mapper/standards-dashboard
    ports:
      - "5174:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hive_data:
  companion_data:
  akm_data:
