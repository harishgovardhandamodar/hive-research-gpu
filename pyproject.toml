[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-research-gpu"
version = "0.2.0"
description = "Lightweight research knowledge base — Dual RTX 5080 GPU + Ollama + Hive datatype"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "arxiv>=2.1.0",
    "PyMuPDF>=1.25.0",
    "requests>=2.32.0",
    "PyYAML>=6.0.0",
    "numpy>=1.24.0",
    "nvidia-ml-py3>=7.352.0",
    "pynvml>=11.5.0",
]

[project.optional-dependencies]
cuda = [
    "cupy-cuda12x>=13.0.0",
    "nvidia-cuda-runtime-cu12",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["hive_research*"]

[tool.setuptools.package-data]
hive_research = ["*.html", "gui_dist/**/*"]
