<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hive Research</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0f172a;--surface:#1e293b;--surface2:#162032;--border:#1e3a5f;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--accent:#60a5fa;--green:#34d399;--red:#f87171;--radius:6px}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:12px;width:320px;min-height:280px;padding:0}
    .header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border)}
    .header .logo{font-size:18px;font-weight:700;color:var(--accent)}
    .header .status{width:8px;height:8px;border-radius:50%;margin-left:auto;flex-shrink:0}
    .header .status.online{background:var(--green);box-shadow:0 0 6px rgba(52,211,153,.4)}
    .header .status.offline{background:var(--red);box-shadow:0 0 6px rgba(248,113,113,.4)}
    .header .status.loading{background:var(--text3);animation:pulse .8s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.4}}
    .content{padding:12px}
    .page-info{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;margin-bottom:10px;word-break:break-word}
    .page-info .title{font-weight:600;font-size:12px;color:var(--text);margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .page-info .url{font-size:10px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .btn{display:block;width:100%;padding:8px;border:none;border-radius:var(--radius);font-size:12px;font-weight:500;cursor:pointer;text-align:center;transition:opacity .12s}
    .btn:hover{opacity:.85}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-primary:disabled{opacity:.4;cursor:not-allowed}
    .btn-success{background:var(--green);color:#fff}
    .btn-error{background:var(--red);color:#fff}
    .result{margin-top:8px;padding:8px 10px;border-radius:var(--radius);font-size:10px;line-height:1.4;display:none}
    .result.success{display:block;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);color:var(--green)}
    .result.error{display:block;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red)}
    .result .label{font-weight:600;margin-bottom:2px}
    .result .detail{color:var(--text2)}
    .footer{padding:8px 12px;border-top:1px solid var(--border);display:flex;gap:6px}
    .footer a{color:var(--text3);text-decoration:none;font-size:10px}
    .footer a:hover{color:var(--accent)}
    .footer .spacer{flex:1}
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🐝 Hive</span>
    <span style="font-size:10px;color:var(--text3)">Web Ingester</span>
    <div class="status" id="statusDot"></div>
  </div>
  <div class="content">
    <div class="page-info">
      <div class="title" id="pageTitle">Loading...</div>
      <div class="url" id="pageUrl">—</div>
    </div>
    <button class="btn btn-primary" id="ingestBtn">Send to Hive Research</button>
    <div class="result" id="result"></div>
  </div>
  <div class="footer">
    <a href="#" id="serverLink">Server: <span id="serverDisplay">—</span></a>
    <span class="spacer"></span>
    <a href="#" id="optionsLink">⚙ Settings</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
