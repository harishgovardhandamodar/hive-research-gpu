<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hive Research — Settings</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0f172a;--surface:#1e293b;--border:#1e3a5f;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--accent:#60a5fa;--green:#34d399;--red:#f87171;--radius:6px}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;max-width:500px;margin:40px auto;padding:0 20px}
    h1{font-size:20px;font-weight:700;color:var(--accent);margin-bottom:20px;display:flex;align-items:center;gap:8px}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px}
    .field input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:13px;outline:none}
    .field input:focus{border-color:var(--accent)}
    .field .hint{font-size:10px;color:var(--text3);margin-top:3px}
    .btn{padding:8px 20px;border:none;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;transition:opacity .12s}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-primary:hover{opacity:.85}
    .status{margin-top:12px;padding:8px 12px;border-radius:var(--radius);font-size:12px;display:none}
    .status.saved{display:block;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);color:var(--green)}
    .status.error{display:block;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red)}
    .actions{display:flex;gap:8px;align-items:center;margin-top:20px}
    .server-info{margin-top:24px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:11px;line-height:1.6}
    .server-info b{color:var(--text2)}
    .server-info .ok{color:var(--green)}
    .server-info .err{color:var(--red)}
  </style>
</head>
<body>
  <h1>🐝 Hive Research — Settings</h1>

  <div class="field">
    <label for="serverUrl">Server URL</label>
    <input type="text" id="serverUrl" placeholder="http://localhost:7777">
    <div class="hint">The address of your Hive Research GPU server. Default: http://localhost:7777</div>
  </div>

  <div class="field">
    <label for="authToken">Auth Token (optional)</label>
    <input type="password" id="authToken" placeholder="Leave blank if auth is not configured">
    <div class="hint">Set if your server uses HIVE_AUTH_TOKEN authentication.</div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="saveBtn">Save</button>
    <button class="btn btn-primary" id="testBtn" style="background:var(--text3)">Test Connection</button>
    <span id="saveStatus" class="status"></span>
  </div>

  <div class="server-info" id="serverInfo">
    <b>Server Status:</b> <span id="connStatus">Not tested</span><br>
    <b>Papers:</b> <span id="statPapers">—</span> &middot;
    <b>Concepts:</b> <span id="statConcepts">—</span> &middot;
    <b>Edges:</b> <span id="statEdges">—</span><br>
    <b>RAG Chunks:</b> <span id="statChunks">—</span>
  </div>

  <script src="options.js"></script>
</body>
</html>
