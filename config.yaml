directories:
  root: ./data
  papers: ./data/papers
  graph: ./data/graph
  vault: ./data/vault

arxiv:
  download_pdf: true
  max_results: 10

ollama:
  base_url: http://localhost:11434
  model: qwen3.6:latest
  fast_model: llama3.2:3b
  embed_model: nomic-embed-text
  max_tokens: 16384
  temperature: 0.1

gpu:
  enabled: false
  device_count: 2
  memory_fraction: 0.95
  parallel_papers: 2
  ollama_instances:
    gpu_0:
      base_url: http://localhost:11434
      cuda_device: 0
      model: qwen3.6:latest
      embed_model: nomic-embed-text
    gpu_1:
      base_url: http://localhost:11435
      cuda_device: 1
      model: llama3.2:3b
      embed_model: nomic-embed-text
  embedding_device: 0
  llm_device: 1

graph:
  similarity_threshold: 0.85

rag:
  chunk_size: 512
  chunk_overlap: 64
  top_k: 5

server:
  host: 0.0.0.0
  port: 7777

# Fox research companion chatbot
fox:
  model: null            # defaults to ollama.model
  max_context_chunks: 8
  history_limit: 12
  temperature: 0.2
  grounding_min_score: 0.15

# Reinforcement feedback loop (rate answers/notes; low ratings trigger re-analysis)
feedback:
  auto_improve: true
  low_rating_threshold: 2   # ratings <= this are "low"
  reanalyze_max: 5          # max papers re-queued per improvement pass

# Research workflow
workflow:
  digest_hours: 24
  domain_presets: []        # e.g. [agents, multiagent, swarms, alignment, llm-security]
