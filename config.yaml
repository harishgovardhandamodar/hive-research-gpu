directories:
  root: ./data
  papers: ./data/papers
  graph: ./data/graph
  vault: ./data/vault

arxiv:
  download_pdf: true
  max_results: 10

hive:
  base_url: http://localhost:8081

ollama:
  base_url: http://localhost:11434
  model: qwen3.6:35b
  fast_model: llama3.2:3b
  embed_model: nomic-embed-text
  max_tokens: 16384
  temperature: 0.1

gpu:
  enabled: false
  device_count: 2
  memory_fraction: 0.95
  parallel_papers: 2

graph:
  similarity_threshold: 0.85

rag:
  chunk_size: 512
  chunk_overlap: 64
  top_k: 5

server:
  host: 0.0.0.0
  port: 7777
