<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hive Research</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b1120;--surface:#162032;--surface2:#1e2d44;--border:#1e3456;--text:#e2e8f0;--text2:#94a3b8;--text3:#546a8a;--accent:#5498ff;--cyan:#2dd4bf;--green:#34d399;--purple:#a78bfa;--orange:#fb923c;--pink:#f472b6;--radius:7px;--shadow:0 2px 12px rgba(0,0,0,.3)}
body.light{--bg:#f8fafc;--surface:#ffffff;--surface2:#f1f5f9;--border:#d1d9e6;--text:#0f172a;--text2:#475569;--text3:#94a3b8;--accent:#3b82f6;--shadow:0 2px 12px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:13px}
#app{display:grid;grid-template-columns:44px 1fr;grid-template-rows:40px 1fr;height:100vh}
/* ── Top bar ── */
#topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--border);z-index:10}
#topbar h1{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.3px}
#topbar .s{width:1px;height:16px;background:var(--border)}
#topbar input{flex:1;max-width:240px;padding:4px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:11px;outline:none}
#topbar input:focus{border-color:var(--accent)}
.btn{padding:4px 12px;border:none;border-radius:var(--radius);font-size:11px;cursor:pointer;background:var(--accent);color:#fff;transition:opacity .12s;white-space:nowrap;line-height:1.5}
.btn:hover{opacity:.8}.btn-o{background:transparent;border:1px solid var(--border);color:var(--text2)}
#themeBtn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:4px;margin-left:auto}
#themeBtn:hover{color:var(--text);background:var(--surface2)}
/* ── Sidebar ── */
#sidebar{grid-row:2;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;z-index:5}
#sidebar .nv{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;font-size:16px;color:var(--text3);transition:all .12s;position:relative}
#sidebar .nv:hover{background:var(--surface2);color:var(--text)}
#sidebar .nv.a{background:var(--accent);color:#fff}
#sidebar .nv .tt{position:absolute;left:40px;top:50%;transform:translateY(-50%);background:var(--surface2);color:var(--text);padding:3px 8px;border-radius:4px;font-size:10px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:20;border:1px solid var(--border)}
#sidebar .nv:hover .tt{opacity:1}
#sidebar .sp{flex:1}
/* ── Main content ── */
#main{grid-row:2;grid-column:2;overflow:hidden;position:relative;background:var(--bg)}
.p{display:none;height:100%;overflow:auto;padding:14px}
.p.a{display:block}
.p h2{font-size:15px;font-weight:600;color:var(--accent);margin-bottom:10px}
/* ── Dashboard panel ── */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.stat-c{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.stat-c .v{font-size:20px;font-weight:700;color:var(--text)}
.stat-c .l{font-size:10px;color:var(--text3);margin-top:1px;text-transform:uppercase;letter-spacing:.4px}
/* ── Graph panel ── */
#graphWrap{width:100%;height:100%;position:relative}
#graphWrap svg{width:100%;height:100%;display:block}
#gEmpty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px}
/* ── Papers panel ── */
#pList{display:flex;flex-direction:column;gap:4px}
.paper-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:background .1s}
.paper-row:hover{background:var(--surface2)}
.paper-row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:12px}
.paper-row .a{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.paper-row .d{font-size:10px;color:var(--text3);white-space:nowrap}
/* ── Detail overlay ── */
#detail{position:fixed;top:0;right:-400px;width:380px;height:100%;background:var(--surface);border-left:1px solid var(--border);z-index:50;transition:right .2s;overflow-y:auto;padding:16px;font-size:12px;box-shadow:-3px 0 20px rgba(0,0,0,.4)}
#detail.open{right:0}
#detail .x{float:right;background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px}
#detail h2{font-size:14px;color:var(--accent);margin-bottom:4px;padding-right:20px}
#detail .m{color:var(--text3);font-size:11px;margin-bottom:8px}
#detail .sb{margin-top:8px}
#detail .sb b{color:var(--text2);font-size:11px}
#detail .sb p{color:var(--text2);line-height:1.5;margin-top:2px}
#detail .sl{list-style:none}
#detail .sl li{padding:3px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
#detail .sl li a{color:var(--accent);text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#detail .sl li a:hover{text-decoration:underline}
#detail .sl .p{font-size:10px;color:var(--text3)}
/* ── Import panel ── */
.imp-g{display:flex;gap:8px;margin-bottom:10px}
.imp-g input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px;outline:none}
.imp-g input:focus{border-color:var(--accent)}
/* ── Similarity ── */
.sim-c{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.sim-c select{padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:11px}
.sim-t{width:100%;border-collapse:collapse;font-size:11px}
.sim-t th{text-align:left;color:var(--text3);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--border)}
.sim-t td{padding:4px 6px;border-bottom:1px solid var(--border)}
.sim-t .sc{font-weight:600;font-size:11px}
.sim-t .sc.h{color:var(--green)}.sim-t .sc.m{color:#fbbf24}.sim-t .sc.l{color:var(--text3)}
/* ── Chat ── */
#chatM{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px 0}
.chat-b{padding:8px 12px;border-radius:var(--radius);max-width:80%;font-size:12px;line-height:1.5}
.chat-b.q{margin-left:auto;background:var(--accent);color:#fff}
.chat-b.r{background:var(--surface);border:1px solid var(--border);color:var(--text2)}
.chat-in{display:flex;gap:8px;padding:8px 0 0;border-top:1px solid var(--border)}
.chat-in input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px;outline:none}
.chat-in input:focus{border-color:var(--accent)}
/* ── Loading ── */
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,17,32,.85);z-index:100;transition:opacity .3s;backdrop-filter:blur(4px)}
#load.h{opacity:0;pointer-events:none}
#load .sp{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 8px}
@keyframes spin{to{transform:rotate(360deg)}}
#load p{color:var(--text3);font-size:12px;text-align:center}
/* ── Log ── */
#log{position:fixed;bottom:8px;right:8px;max-width:360px;z-index:60;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.log-e{padding:4px 10px;border-radius:4px;font-size:10px;animation:fade .3s}
.log-e.i{background:rgba(84,152,255,.15);color:var(--accent)}
.log-e.d{background:rgba(52,211,153,.12);color:var(--green)}
.log-e.w{background:rgba(251,191,36,.12);color:#fbbf24}
.log-e.e{background:rgba(248,113,113,.12);color:#f87171}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
/* ── Responsive ── */
@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:36px 1fr}#sidebar{display:none}#detail{width:100%;right:-100%}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>&#x1F9D1;&#x200D;&#x1F4BB; Hive</h1>
    <div class="s"></div>
    <input id="gSearch" placeholder="Search graph..." oninput="G.search(this.value)">
    <button class="btn" onclick="G.refresh()">&#x21bb; Refresh</button>
    <button id="themeBtn" onclick="H.toggleTheme()">&#x263E;</button>
  </div>
  <div id="sidebar">
    <div class="nv a" data-v="dash" onclick="H.switch('dash',this)">&#x1F4CA;<div class="tt">Dashboard</div></div>
    <div class="nv" data-v="graph" onclick="H.switch('graph',this)">&#x25E1;<div class="tt">Graph</div></div>
    <div class="nv" data-v="papers" onclick="H.switch('papers',this)">&#x1F4D6;<div class="tt">Papers</div></div>
    <div class="nv" data-v="landscape" onclick="H.switch('landscape',this)">&#x1F30D;<div class="tt">Landscape</div></div>
    <div class="nv" data-v="similarity" onclick="H.switch('similarity',this)">&#x2248;<div class="tt">Similarity</div></div>
    <div class="nv" data-v="import" onclick="H.switch('import',this)">&#x2795;<div class="tt">Import</div></div>
    <div class="nv" data-v="chat" onclick="H.switch('chat',this)">&#x1F4AC;<div class="tt">Chat</div></div>
    <div class="sp"></div>
    <div class="nv" onclick="H.switch('landscape',document.querySelector('[data-v=landscape]'))">&#x1F30D;<div class="tt">Landscape</div></div>
  </div>
  <div id="main">
    <!-- Dashboard -->
    <div class="p a" id="p-dash">
      <h2>Dashboard</h2>
      <div class="stats" id="statsR"></div>
      <div style="color:var(--text3);font-size:11px;margin-top:8px">Select a view from the sidebar to get started.</div>
    </div>
    <!-- Graph -->
    <div class="p" id="p-graph">
      <div id="graphWrap"><div id="gEmpty">No graph data</div></div>
    </div>
    <!-- Papers -->
    <div class="p" id="p-papers"><div id="pList"></div></div>
    <!-- Landscape -->
    <div class="p" id="p-landscape" style="padding:0"><canvas id="lCanvas"></canvas></div>
    <!-- Similarity -->
    <div class="p" id="p-similarity">
      <div class="sim-c">
        <select id="simAlgo"><option value="combined">Combined</option><option value="vector">Vector</option><option value="abstract">Abstract</option><option value="author">Author</option></select>
        <button class="btn" onclick="S.load()">&#x2248; Compute</button>
      </div>
      <div style="overflow:auto" id="simR"></div>
    </div>
    <!-- Import -->
    <div class="p" id="p-import">
      <h2>Add Paper</h2>
      <div class="imp-g"><input id="impId" placeholder="arXiv ID or URL"><button class="btn" onclick="I.add()">Add</button></div>
      <h2>Web Link</h2>
      <div class="imp-g"><input id="impUrl" placeholder="https://..."><button class="btn" onclick="I.web()">Ingest</button></div>
      <h2>Search arXiv</h2>
      <div class="imp-g"><input id="impQ" placeholder="search query"><button class="btn" onclick="I.search()">Search</button></div>
    </div>
    <!-- Chat -->
    <div class="p" id="p-chat" style="display:flex;flex-direction:column">
      <div id="chatM"></div>
      <div class="chat-in"><input id="chatIn" placeholder="Ask about your research..." onkeydown="if(event.key==='Enter')C.send()"><button class="btn" onclick="C.send()">Send</button></div>
    </div>
  </div>
</div>
<div id="detail"></div>
<div id="load"><div><div class="sp"></div><p>Loading...</p></div></div>
<div id="log"></div>

<script>
(function(){
'use strict';

const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const api=async(p,method,body)=>{const o={method:method||'GET',headers:{'Content-Type':'application/json'}};if(body)o.body=JSON.stringify(body);const r=await fetch(p,o);return r.json()};
const log=(msg,type='i')=>{const e=$('log');const d=document.createElement('div');d.className='log-e '+type;d.textContent=msg;e.appendChild(d);setTimeout(()=>d.remove(),4000)};

// ── Theme ──
const theme=(()=>{
  const saved=localStorage.getItem('hive_theme');
  if(saved==='light'){document.body.classList.add('light');$('themeBtn').textContent='\u2600'}
  return {
    toggle(){document.body.classList.toggle('light');const isLight=document.body.classList.contains('light');
      localStorage.setItem('hive_theme',isLight?'light':'dark');$('themeBtn').textContent=isLight?'\u2600':'\u263E'}
  };
})();

// ── Navigation ──
const nav={
  current:'dash',
  switch(name,el){
    document.querySelectorAll('.p').forEach(p=>p.classList.remove('a'));
    const target=$(('p-'+name));
    if(target)target.classList.add('a');
    document.querySelectorAll('.nv').forEach(n=>n.classList.remove('a'));
    if(el)el.classList.add('a');
    this.current=name;
    if(name==='graph')setTimeout(()=>G.render(),50);
    if(name==='landscape')setTimeout(()=>L.render(),50);
    if(name==='papers')P.load();
    if(name==='similarity')S.render();
  }
};

// ── API helpers ──
const statsEl=()=>$('statsR');

// ── Dashboard ──
const D={
  async load(){
    try{
      const stats=await api('/api/stats');
      if(!stats)return;
      const items=[
        {v:stats.papers||0,l:'Papers'},{v:stats.concepts||0,l:'Concepts'},
        {v:stats.relations||0,l:'Edges'},{v:stats.graph_papers||0,l:'Graph Papers'},
        {v:stats.graph_refs||0,l:'Refs'},{v:stats.cross_edges||0,l:'Cross Edges'},
      ];
      $('statsR').innerHTML=items.map(i=>`<div class="stat-c"><div class="v">${i.v}</div><div class="l">${i.l}</div></div>`).join('');
    }catch(e){}
  }
};

// ── Graph ──
const G={
  data:null,
  async refresh(){
    try{
      const [g,stats]=await Promise.all([api('/api/graph'),api('/api/stats')]);
      this.data=g;if(stats)D.load();
      if(nav.current==='graph')this.render();
      log('Graph refreshed','d');
    }catch(e){log('Failed to load graph','e')}
  },
  render(){
    const wrap=$('graphWrap');const empty=$('gEmpty');
    if(!this.data||!this.data.nodes||!this.data.nodes.length){empty.style.display='flex';return}
    empty.style.display='none';
    const svg=d3.select('#graphWrap svg');
    if(svg.empty()){d3.select('#graphWrap').insert('svg',':first-child');}
    const rect=wrap.getBoundingClientRect();
    const W=rect.width||800,H=rect.height||500;
    const svgEl=d3.select('#graphWrap svg').attr('width',W).attr('height',H).attr('viewBox',[0,0,W,H]);
    svgEl.selectAll('*').remove();
    const links=this.data.links.map(d=>({...d}));
    const nodes=this.data.nodes.map(d=>({...d}));
    const sim=d3.forceSimulation(nodes)
      .force('link',d3.forceLink(links).id(d=>d.id).distance(100))
      .force('charge',d3.forceManyBody().strength(-200))
      .force('center',d3.forceCenter(W/2,H/2))
      .force('collision',d3.forceCollide(12))
      .alphaDecay(.03);
    const defs=svgEl.append('defs');
    defs.append('marker').attr('id','ar').attr('viewBox','0 -5 10 10').attr('refX',14).attr('refY',0).attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto')
      .append('path').attr('d','M0,-5L10,0L0,5').attr('fill','var(--border)');
    const link=svgEl.append('g').selectAll('line').data(links).join('line')
      .attr('stroke','var(--border)').attr('stroke-width',d=>d.relation==='cites'?1.2:.6).attr('stroke-opacity',.6).attr('marker-end','url(#ar)');
    const node=svgEl.append('g').selectAll('g').data(nodes).join('g').call(d3.drag()
      .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y})
      .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
    node.append('title').text(d=>d.label||'');
    const ps=Math.min(14,36/Math.max(Math.sqrt(nodes.length),1));
    node.filter(d=>d.group===0).append('rect').attr('width',ps).attr('height',ps).attr('x',-ps/2).attr('y',-ps/2).attr('rx',3)
      .attr('fill','var(--accent)').attr('stroke','var(--accent)').attr('stroke-width',1.5).attr('stroke-opacity',.4);
    node.filter(d=>d.group===1).append('circle').attr('r',ps/1.6)
      .attr('fill','var(--purple)').attr('stroke','var(--purple)').attr('stroke-width',1.5).attr('stroke-opacity',.4);
    node.filter(d=>d.type==='web').append('rect').attr('width',ps+2).attr('height',ps+2).attr('x',-(ps+2)/2).attr('y',-(ps+2)/2).attr('rx',2).attr('transform','rotate(45)')
      .attr('fill','var(--orange)').attr('stroke','var(--orange)').attr('stroke-width',1.5).attr('stroke-opacity',.4);
    const labels=node.append('text').text(d=>{
      const l=d.label||'';return l.length>25?l.substring(0,22)+'…':l;
    }).attr('font-size','7px').attr('text-anchor','middle').attr('dy',d=>d.group===1?-ps/1.6-3:ps/2+10).attr('fill','var(--text2)').attr('pointer-events','none');
    node.on('click',(e,d)=>{e.stopPropagation();showDetail(d)});
    sim.on('tick',()=>{
      link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      node.attr('transform',d=>`translate(${d.x},${d.y})`);
    });
  },
  search(q){
    if(!this.data)return;
    q=q.toLowerCase();
    d3.selectAll('#graphWrap g g').attr('opacity',d=>!q||(d.label||'').toLowerCase().includes(q)?1:.15);
  }
};

// ── Papers ──
const P={
  data:null,
  async load(){
    try{
      this.data=await api('/api/papers');
      this.render();
    }catch(e){}
  },
  render(){
    if(!this.data||!this.data.length){$('pList').innerHTML='<div style="color:var(--text3);font-size:12px">No papers</div>';return}
    $('pList').innerHTML=this.data.map(p=>`<div class="paper-row" onclick="showDetailById('${esc(p.id)}')">
      <div class="t">${esc(p.title||'')}</div>
      <div class="a">${esc((p.authors||'').substring(0,60))}</div>
      <div class="d">${p.published||''}</div>
    </div>`).join('');
  }
};

// ── Detail ──
async function showDetail(node){
  const id=node.id||node.arxiv_id;
  const detail=$('detail');
  const p=node;
  let sim=[];
  try{sim=await api('/api/similarity','POST',{paper_ids:[id],algorithm:'combined'})}catch(e){}
  const si=(sim||[]).filter(s=>s.source!==s.target&&(s.source===id||s.target===id)).sort((a,b)=>b.score-a.score).slice(0,8);
  let sh='';
  if(si.length){
    sh='<div class="sb"><b>Similar</b><ul class="sl">'+si.map(s=>{
      const oid=s.source===id?s.target:s.source;const ot=s.source===id?s.target_title:s.source_title;
      return '<li><a href="#" onclick="event.preventDefault();showDetailById(\''+esc(oid)+'\')">'+esc(ot.substring(0,50))+'</a><span class="p">'+(s.score*100).toFixed(0)+'%</span></li>';
    }).join('')+'</ul></div>';
  }
  detail.innerHTML='<button class="x" onclick="closeDetail()">&#x2716;</button>'+
    '<h2>'+esc(p.label||p.title||'')+'</h2>'+
    '<div class="m">'+(p.authors?esc(p.authors):'')+(p.published?' &middot; '+p.published:'')+'</div>'+
    (p.abstract?'<div class="sb"><b>Abstract</b><p>'+esc(p.abstract.substring(0,400))+'</p></div>':'')+
    sh;
  detail.classList.add('open');
}
async function showDetailById(id){
  try{
    const papers=await api('/api/papers');
    const p=papers.find(x=>x.id===id);
    if(p)showDetail(p);
  }catch(e){}
}
function closeDetail(){$('detail').classList.remove('open')}

// ── Landscape ──
const L={
  data:null,simData:null,nodes:null,links:null,
  tx:0,ty:0,k:1,drag:false,d0:null,moved:false,
  async refresh(){
    try{
      const [p,s]=await Promise.all([api('/api/papers'),api('/api/similarity','POST',{algorithm:'combined'})]);
      this.data=Array.isArray(p)?p:[];this.simData=Array.isArray(s)?s:[];
      if(nav.current==='landscape')this.render();
    }catch(e){}
  },
  render(){
    const canvas=$('lCanvas');const parent=canvas.parentElement;
    const rect=parent.getBoundingClientRect();
    if(!rect.width||!rect.height)return;
    const dpr=window.devicePixelRatio||1;
    canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
    canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';
    const ctx=canvas.getContext('2d');
    const W=rect.width,H=rect.height;
    const papers=this.data||[],simData=this.simData||[];
    if(!papers.length){
      ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='var(--bg)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#64748b';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('No papers',W/2,H/2);
      return;
    }
    const nodes=papers.map(p=>({id:p.id,label:p.title||p.label}));
    const adj={};simData.forEach(s=>{if(!s||typeof s.score!=='number')return;
      [s.source,s.target].forEach((id,i)=>{if(!adj[id])adj[id]=[];adj[id].push({id:i===0?s.target:s.source,score:s.score})})});
    const links=[];const seen=new Set();
    Object.keys(adj).forEach(id=>{adj[id].sort((a,b)=>b.score-a.score).slice(0,4).forEach(s=>{
      const key=[id,s.id].sort().join('|');if(!seen.has(key)&&papers.find(p=>p.id===s.id)){seen.add(key);links.push({source:id,target:s.id,score:s.score})}
    })});
    const cols=Math.ceil(Math.sqrt(nodes.length));
    nodes.forEach((n,i)=>{n.x=W/2+(i%cols-cols/2)*25;n.y=H/2+(Math.floor(i/cols)-Math.ceil(nodes.length/cols)/2)*25});
    if(links.length){
      const sim=d3.forceSimulation(nodes)
        .force('link',d3.forceLink(links).id(d=>d.id).distance(d=>120-(d.score||0)*60).strength(d=>Math.max(.01,(d.score||0)*.6)))
        .force('charge',d3.forceManyBody().strength(-120)).force('center',d3.forceCenter(W/2,H/2)).force('collision',d3.forceCollide(10))
        .alphaDecay(.03).on('tick',()=>draw()).on('end',()=>{sim.stop();draw()});
      setTimeout(()=>{sim.alphaTarget(0);sim.stop();draw()},3000);
    }else draw();
    function draw(){
      ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--bg').trim()||'#0b1120';ctx.fillRect(0,0,W,H);
      nodes.forEach(n=>{if(!isFinite(n.x))n.x=W/2;if(!isFinite(n.y))n.y=H/2;n.x=Math.max(5,Math.min(W-5,n.x));n.y=Math.max(5,Math.min(H-5,n.y))});
      links.forEach(l=>{const s=l.source,t=l.target;if(!s||!t||typeof s==='string'||typeof t==='string')return;
        ctx.beginPath();ctx.moveTo(s.x||0,s.y||0);ctx.lineTo(t.x||0,t.y||0);
        ctx.strokeStyle='rgba(148,163,184,'+(.06+Math.min((l.score||0),1)*.14)+')';ctx.lineWidth=Math.max(.3,(l.score||0)*1.5);ctx.stroke()});
      const r=Math.max(4,Math.min(10,24/Math.max(Math.sqrt(nodes.length),1)));
      nodes.forEach(n=>{const x=n.x,y=n.y;
        ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
        ctx.fillStyle='var(--accent)';ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=.5;ctx.stroke();
        if(L.k>.6){let lb=(n.label||'').substring(0,30);ctx.font='9px sans-serif';ctx.fillStyle='var(--text2)';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(lb,x,y+r+2)}
      });
    }
  }
};

// ── Similarity ──
const S={
  data:null,
  async load(){
    try{
      const algo=$('simAlgo').value;log('Computing similarity...','i');
      this.data=await api('/api/similarity','POST',{algorithm:algo});
      this.render();log(`Similarity: ${(this.data||[]).length} pairs`,'d');
    }catch(e){log('Similarity error','e')}
  },
  render(){
    if(!this.data||!this.data.length){$('simR').innerHTML='<div style="color:var(--text3);padding:10px">No data. Click Compute.</div>';return}
    const items=this.data.slice(0,200);
    $('simR').innerHTML='<table class="sim-t"><thead><tr><th>Paper A</th><th>Paper B</th><th>Score</th></tr></thead><tbody>'+
      items.map(s=>{const cls=s.score>.3?'h':s.score>.15?'m':'l';
        return '<tr><td>'+esc(s.source_title.substring(0,50))+'</td><td>'+esc(s.target_title.substring(0,50))+'</td><td><span class="sc '+cls+'">'+(s.score*100).toFixed(0)+'%</span></td></tr>'}).join('')+
      '</tbody></table>'+(this.data.length>200?`<div style="color:var(--text3);font-size:10px;padding:6px">Showing 200 of ${this.data.length} pairs</div>`:'');
  }
};

// ── Import ──
const I={
  async add(){
    const val=$('impId').value.trim();if(!val)return;
    log('Adding paper...','i');$('impId').value='';
    try{const r=await api('/api/add','POST',{id:val});
      if(r.status==='added')log(`Added: ${r.paper_id} (${r.concepts||0} concepts)`,'d');
      else log(r.message||'Already exists','w');G.refresh();
    }catch(e){log('Error adding paper','e')}
  },
  async web(){
    const val=$('impUrl').value.trim();if(!val)return;
    log('Ingesting web page...','i');$('impUrl').value='';
    try{const r=await api('/api/web/add','POST',{url:val});
      if(r.status==='added')log(`Ingested: ${r.title||r.id}`,'d');
      else log(r.message||'Error','w');G.refresh();
    }catch(e){log('Error ingesting','e')}
  },
  async search(){
    const val=$('impQ').value.trim();if(!val)return;
    log('Searching arXiv...','i');
    try{const r=await api('/api/search','POST',{query:val});
      if(r.status==='ok')log(`Search: ${r.added||0} added, ${r.exists||0} existed`,'d');
      else log(r.message||'Error','w');G.refresh();
    }catch(e){log('Error searching','e')}
  }
};

// ── Chat ──
const C={
  async send(){
    const input=$('chatIn');const q=input.value.trim();if(!q)return;
    input.value='';const cont=$('chatM');
    cont.innerHTML+=`<div class="chat-b q">${esc(q)}</div>`;cont.scrollTop=cont.scrollHeight;
    try{
      const r=await api('/api/query','POST',{question:q});
      const answer=r.answer||r.response||JSON.stringify(r);
      cont.innerHTML+=`<div class="chat-b r">${esc(answer)}</div>`;cont.scrollTop=cont.scrollHeight;
    }catch(e){cont.innerHTML+=`<div class="chat-b r" style="color:#f87171">Error: ${esc(e.message)}</div>`}
  }
};

// ── Init ──
document.addEventListener('DOMContentLoaded',async ()=>{
  $('load').classList.remove('h');
  try{await Promise.all([G.refresh(),D.load(),P.load()])}catch(e){}
  $('load').classList.add('h');
});

window.H=nav;window.G=G;window.P=P;window.S=S;window.I=I;window.C=C;window.L=L;
window.showDetail=showDetail;window.showDetailById=showDetailById;window.closeDetail=closeDetail;

})();
</script>
